  const arr = spellsOf[cd];
  if(!arr) return null;
  let hit = null;
  for(const s of arr){
    if(i < s.a || i > s.b) continue;
    if(s.s === 1) return s;
    if(!hit) hit = s;
  }
  return hit;
}
function colorOf(sp){
  if(!sp) return D.none;
  if(sp.s === 0) return D.unknown;
  for(const pair of D.series) if(sp.c.indexOf(pair[0]) >= 0) return pair[1];
  return D.other;
}

const NS = "http://www.w3.org/2000/svg";
function path(d, cls){
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", d);
  p.setAttribute("class", cls);
  return p;
}

const paths = {};
D.dong.forEach(function(d){
  const p = path(d.d, "dong");
  p.addEventListener("mousemove", function(e){ showTip(e, d); });
  p.addEventListener("mouseleave", function(){ tip.style.display = "none"; });
  svg.appendChild(p);
  paths[d.cd] = p;
});
D.gu.forEach(function(g){ svg.appendChild(path(g.d, "gu")); });
D.dong.filter(function(d){
  return D.treated.indexOf(d.nm) >= 0 &&
         (d.gu === "강남구" || d.gu === "송파구");
}).forEach(function(d){ svg.appendChild(path(d.d, "trt")); });

sl.max = D.months.length - 1;
let cur = 0;

function draw(i){
  cur = i;
  document.getElementById("ym").textContent = D.months[i];
  let on = 0, unk = 0;
  D.dong.forEach(function(d){
    const sp = at(d.cd, i);
    paths[d.cd].setAttribute("fill", colorOf(sp));
    if(sp && sp.s === 1) on++;
    else if(sp) unk++;
  });
  document.getElementById("cnt").textContent =
    "지정 " + on + "개 동 · 불명 " + unk + "개 / 전체 " + D.dong.length + "개";
  document.getElementById("note").textContent =
    i > D.endIdx ? "— 식별 구간 밖 (통제군 소멸)" : "";
}
sl.addEventListener("input", function(){ draw(+sl.value); });

function showTip(e, d){
  const sp = at(d.cd, cur);
  let h = "<b>" + d.gu + " " + d.nm + "</b><br>";
  if(!sp) h += "미지정";
  else if(sp.s === 0) h += "불명 — 공고를 아직 못 읽은 구간";
  else {
    h += "지정 · " + sp.w + "<br>" + (sp.c || "계열 미상");
    if(sp.n) h += '<br><span style="opacity:.7">' + sp.n + "</span>";
  }
  tip.innerHTML = h;
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 300) + "px";
  tip.style.top  = Math.min(e.clientY + 14, innerHeight - 110) + "px";
}

const lg = document.getElementById("lg");
D.series.concat([["그 밖의 계열", D.other], ["불명", D.unknown],
                 ["미지정", D.none]]).forEach(function(pair){
  lg.insertAdjacentHTML("beforeend",
    '<div><span class="sw" style="background:' + pair[1] + '"></span>' +
    pair[0] + "</div>");
});

const ev = document.getElementById("ev");
ev.innerHTML = D.events.map(function(e){
  return '<b class="j" data-ym="' + e.ym + '">' + e.label + "</b>";
}).join("<br>");
ev.addEventListener("click", function(e){
  const ym = e.target.dataset ? e.target.dataset.ym : null;
  if(!ym) return;
  const i = D.months.indexOf(ym);
  if(i >= 0){ sl.value = i; draw(i); }
});

let timer = null;
document.getElementById("play").addEventListener("click", function(){
  if(timer){ clearInterval(timer); timer = null; this.textContent = "재생"; return; }
  this.textContent = "멈춤";
  const self = this;
  timer = setInterval(function(){
    let i = cur + 1;
    if(i > +sl.max){ clearInterval(timer); timer = null; self.textContent = "재생"; return; }
    sl.value = i; draw(i);
  }, 170);
});

const start = D.months.indexOf("2020-06");
sl.value = start > 0 ? start : 0;
draw(+sl.value);
</script>
</html>
